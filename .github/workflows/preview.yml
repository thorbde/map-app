# A preview deploy per PR, in the separate Previews Cloudflare account (ADR 0006):
# the app, and Storybook with the design-system playgrounds.
#
# - build:   builds the PR's code with no Cloudflare secrets in reach.
# - deploy:  deploys those builds as their own Workers, map-app-pr-<number> and
#            map-app-storybook-pr-<number>, using only the preview token, and posts the
#            URLs as one comment that it keeps updated.
#            The app gets its own D1, memogra-pr-<number>, in the EU, with the migrations
#            applied (M2 PR 2).
# - cleanup: deletes both Workers and the database when the PR closes.
#
# The preview token can't reach production: it belongs to a different account.

name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # Explicit bash adds -o pipefail, so a failing command piped into tee fails the step.
    shell: bash

env:
  APP_WORKER: map-app-pr-${{ github.event.pull_request.number }}
  STORYBOOK_WORKER: map-app-storybook-pr-${{ github.event.pull_request.number }}
  # The preview's own database. .github/scripts/preview-database.sh refuses any other name.
  PREVIEW_DATABASE: memogra-pr-${{ github.event.pull_request.number }}
  # Keep in step with apps/web/package.json. Deploy and cleanup run wrangler with
  # npx so they never install the PR's dependencies next to the token.
  WRANGLER_VERSION: 4.162.0
  COMMENT_MARKER: "<!-- preview-deploy -->"
  # The Previews account's workers.dev subdomain: every preview's address ends in it.
  PREVIEW_HOSTS: previews-d21.workers.dev
  # Google answers previews only here, and hands the sign-in back (ADR 0022, auth-helper.yml).
  AUTH_HELPER_URL: https://memogra-main.previews-d21.workers.dev

jobs:
  build:
    # Fork PRs get no secrets, so they get no preview.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm build:storybook
      - uses: actions/upload-artifact@v7
        with:
          name: preview-build
          path: |
            apps/web/build
            packages/ui/storybook-static
          include-hidden-files: true # build/client/.assetsignore
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/scripts
            apps/web/app/server/db/migrations
      - uses: actions/download-artifact@v8
        with:
          name: preview-build
      - name: Create, migrate and bind the preview database
        run: |
          bash .github/scripts/preview-database.sh deploy "$PREVIEW_DATABASE" \
            apps/web/app/server/db/migrations apps/web/build/server/wrangler.json
      - name: Deploy the app, with the sign-in settings
        id: app
        env:
          # The preview Google client and secret (m2.md, "What you create yourself"). They go to
          # Cloudflare as Worker secrets, through a file that is deleted straight after.
          BETTER_AUTH_SECRET: ${{ secrets.PREVIEW_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.PREVIEW_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.PREVIEW_GOOGLE_CLIENT_SECRET }}
        run: |
          own_url="https://${APP_WORKER}.${PREVIEW_HOSTS}"
          secrets_file="$(bash .github/scripts/auth-secrets.sh)"
          trap 'rm -f "$secrets_file"' EXIT
          url=$(bash .github/scripts/deploy-worker.sh \
            --config apps/web/build/server/wrangler.json --name "$APP_WORKER" \
            --secrets-file "$secrets_file" \
            --var "BETTER_AUTH_URL:${own_url}" --var "AUTH_PROXY_URL:${AUTH_HELPER_URL}")
          if [ "$url" != "$own_url" ]; then
            echo "::error::The preview is at $url, not $own_url: update PREVIEW_HOSTS, or sign-in sends people to the wrong place." >&2
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Deploy Storybook (static files only)
        id: storybook
        run: |
          url=$(bash .github/scripts/deploy-worker.sh \
            --assets packages/ui/storybook-static --name "$STORYBOOK_WORKER" \
            --compatibility-date 2026-11-01)
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post or update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          APP_URL: ${{ steps.app.outputs.url }}
          STORYBOOK_URL: ${{ steps.storybook.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body=$(printf '%s\n**App preview:** %s\n**Storybook:** %s\n\nBuilt from %s. Updated on every push, removed when the PR closes.' \
            "$COMMENT_MARKER" "$APP_URL" "$STORYBOOK_URL" "${SHA:0:7}")
          bash .github/scripts/upsert-preview-comment.sh "$PR" "$body"

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PREVIEW_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PREVIEW_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Delete the preview Workers and database
        # Try all, then fail if any failed, so one failure can't leave the others behind.
        run: |
          rc=0
          bash .github/scripts/delete-worker.sh "$APP_WORKER" || rc=1
          bash .github/scripts/delete-worker.sh "$STORYBOOK_WORKER" || rc=1
          bash .github/scripts/preview-database.sh delete "$PREVIEW_DATABASE" || rc=1
          exit "$rc"
      - name: Update the preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body=$(printf '%s\n**Previews:** removed, because the PR was closed.' "$COMMENT_MARKER")
          bash .github/scripts/upsert-preview-comment.sh "$PR" "$body" --update-only
