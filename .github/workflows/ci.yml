# On every PR and on main:
# - check: lint, typecheck, import boundaries, knip, unit/integration/boundary tests,
#          component tests (every Storybook story, with accessibility checks), build,
#          the JavaScript size budget, and (on main) the dependency graph in the run summary
# - e2e:   Playwright against the production build served locally
# Both job names are required status checks in the main ruleset.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    # Explicit bash adds -o pipefail, so a failing command piped into tee fails the step.
    shell: bash

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Third-party action, pinned to a commit (v6.1.1). Reads pnpm's version from package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for the component tests (Storybook stories run in a browser)
        run: pnpm --filter @thorbde/ui exec playwright install --with-deps chromium
      - name: Lint, typecheck, boundaries, knip and tests
        run: pnpm check
      - run: pnpm build
      - name: Storybook builds (design-system playgrounds and components)
        run: pnpm build:storybook
      - name: JavaScript size budget (ADR 0013)
        run: pnpm size
      - name: Dependency graph, shown in the run summary (for the weekly check)
        if: github.event_name == 'push'
        run: |
          {
            echo "## Dependency graph"
            echo '```mermaid'
            pnpm --silent graph
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: End-to-end tests (builds, then serves the build locally)
        run: pnpm test:e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
